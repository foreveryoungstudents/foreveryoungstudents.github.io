<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои приложения</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f6ef7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1d2026;
      --text: #e8eaed;
      --muted: #9aa0a9;
      --border: #2c3038;
      --accent: #7c93ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 40px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .subtitle {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 15px;
  }
  .list { display: grid; gap: 12px; }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .icon { font-size: 28px; line-height: 1; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; }
  .desc { font-size: 14px; color: var(--muted); }
  .arrow { color: var(--muted); font-size: 18px; }
  .card:hover .arrow { color: var(--accent); }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Мои приложения</h1>
  <p class="subtitle">Небольшие инструменты для учёбы и не только</p>

  <div class="list">

    <!-- ===== КАРТОЧКА ПРИЛОЖЕНИЯ (копируйте этот блок для каждого нового) ===== -->
    <a class="card" href="https://foreveryoungstudents.github.io/vocabulary-trainer/">
      <span class="icon">🔊</span>
      <span class="info">
        <div class="title">Vocabulary Trainer</div>
        <div class="desc">Английский словарь A1–C2: озвучка, транскрипция, произношение</div>
      </span>
      <span class="arrow">→</span>
    </a>
    <!-- ===== КОНЕЦ КАРТОЧКИ ===== -->

    <a class="card" href="https://foreveryoungstudents.github.io/REPO-NAME/">
      <span class="icon">📚</span>
      <span class="info">
        <div class="title">Название приложения</div>
        <div class="desc">Короткое описание</div>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="https://foreveryoungstudents.github.io/REPO-NAME-2/">
      <span class="icon">🧮</span>
      <span class="info">
        <div class="title">Ещё одно приложение</div>
        <div class="desc">Короткое описание</div>
      </span>
      <span class="arrow">→</span>
    </a>

  </div>

  <footer>foreveryoungstudents</footer>
</main>
</body>
</html>
