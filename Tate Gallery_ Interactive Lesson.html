<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tate Gallery: Interactive Lesson</title><style>
:root{--bg:#f6f8fb;--cd:#fff;--tx:#1b2330;--mu:#5d6b7d;--ac:#2e75b6;--ok:#2e8b57;--no:#c0392b;--bd:#d9e1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--cd:#19212b;--tx:#e8edf3;--mu:#97a6b8;--ac:#6fb1ea;--ok:#4cc38a;--no:#ff7b6b;--bd:#2b3644}}
:root[data-theme="dark"]{--bg:#10151c;--cd:#19212b;--tx:#e8edf3;--mu:#97a6b8;--ac:#6fb1ea;--ok:#4cc38a;--no:#ff7b6b;--bd:#2b3644}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,nav,main{max-width:720px;margin:auto;padding:0 14px}header{padding-top:14px}h1{margin:0;font-size:20px}.mu{color:var(--mu);font-size:14px}
nav{display:flex;gap:6px;margin:10px auto;flex-wrap:wrap}nav button,.row button,.opt,.chk{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:15px}
nav button{flex:1}nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.big{min-height:150px;align-items:center;justify-content:center;text-align:center;font-size:24px;cursor:pointer}
.row{display:flex;gap:8px;justify-content:center}.pl{border:0;background:var(--ac);color:#fff;border-radius:50%;width:38px;height:38px;font-size:16px;align-self:flex-start}
input{width:100%;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.opt{text-align:left}.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 20%,var(--cd))!important}.no{border-color:var(--no)!important;background:color-mix(in srgb,var(--no) 20%,var(--cd))!important}
.ans{color:var(--ac);font-weight:600;display:flex;gap:8px;align-items:center}.good{color:var(--ok)}.bad{color:var(--no)}.sc{font-weight:600;padding:6px 0}
</style></head><body><header><h1>Tate Gallery &amp; museum vocabulary</h1><div class="mu">Interactive lesson · по страницам вашего учебника (Урок 1)</div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const V=[["antiques dealer","продавец антиквариата"],["art collection, collection of artworks","собрание произведений искусства"],["bequeath","передавать потомству"],["bequest","наследство"],["collection of British art","собрание британского искусства"],["cultural assets","культурное наследие"],["display","экспонировать"],["fame and fortune","слава и богатство"],["founding collection","основная коллекция"],["house","размещать"],["lavish","щедро раздавать"],["legacy","наследие"],["permanent collection","постоянная коллекция"],["Pre-Raphaelite artists","прерафаэлиты"],["provide funding","финансировать"],["room","зал"],["site","корпус"],["temporary exhibitions","временные выставки"],["turn down the bequest","отказаться от наследства"]];
const L=["nearly 70,000 artworks","four major sites","bequest of 65 paintings","an £80,000 donation","opened in 1897","bequeathed in 1783","opened in 1807","located in the University first site","from 12.00 pm until 2.00 pm every day","one of the finest collections","one of Scotland’s cultural assets"];
const R=[["с 2018 года","since 2018"],["основан 13 апреля 1870 года","founded on 13 April 1870"],["открылся для публики 20 февраля 1872 года","opened to the public on 20 February 1872"],["в 2013 году","in 2013"],["Пятая авеню, дом № 1000","1000 Fifth Avenue"],["переехал в 1880 году","moved in 1880"],["174 произведения европейской живописи","174 works of European painting"],["38 полотен","38 canvases"],["но только в XX веке","but only in the twentieth century"],["первая картина Огюста Ренуара","the first painting by Auguste Renoir"],["две панели","two panels"]];
const Q=[["When did the Tate Gallery first open to the public?",["1889","1897","1910"],1],["How did Henry Tate make his fortune?",["As an art dealer","As a sugar refiner","As a painter"],1],["Why was Tate’s bequest of 65 paintings turned down by the National Gallery?",["The works were too modern","The trustees disliked Pre-Raphaelites","There was not enough space"],2],["How many major sites does Tate have today?",["Two","Four","Seven"],1],["The £80,000 donation helped to build the gallery at…",["Millbank","Glasgow","Oxford"],0],["The Duveen Sculpture Galleries were the first galleries built specifically for…",["modern art","sculpture","temporary exhibitions"],1]];
const T=["Cards","Listen & type","RU → EN","Quiz"],A=document.getElementById("app"),syn=window.speechSynthesis;let tab=0,ci=0,fl=false;
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function say(t){if(!syn){alert("Speech is not supported in this browser.");return}syn.cancel();const u=new SpeechSynthesisUtterance(t),v=syn.getVoices().find(v=>v.lang.replace("_","-")==="en-GB")||syn.getVoices().find(v=>v.lang.startsWith("en"));u.lang="en-GB";if(v)u.voice=v;u.rate=.9;syn.speak(u)}
const pb=t=>{const b=h("button","pl","🔊");b.onclick=()=>say(t);return b};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/(\d)(am|pm)/g,"$1 $2").replace(/\s+/g," ").trim();
function cards(){const[e,r]=V[ci],c=h("div","card big",fl?r:e);c.onclick=()=>{fl=!fl;if(!fl)say(e);view()};A.append(h("div","mu",(ci+1)+" / "+V.length),c);
const w=h("div","row");[["◀",-1],["🔊",0],["▶",1]].forEach(([l,d])=>{const b=h("button","",l);b.onclick=()=>{if(!d){say(e);return}ci=(ci+d+V.length)%V.length;fl=false;view()};w.append(b)});A.append(w,h("p","mu","Tap the card to flip it. Нажмите на карточку, чтобы увидеть перевод."))}
function listen(){A.append(h("p","mu","Listen, then type the phrase. Numbers can be typed as digits."));L.forEach(t=>{const c=h("div","card"),w=h("div","row"),i=h("input"),m=h("div","ans"),k=h("button","chk","Check");
i.placeholder="Type what you hear…";const go=()=>{const ok=norm(i.value)===norm(t);m.className="ans "+(ok?"good":"bad");m.textContent=ok?"✓ Correct":"✗ "+t};k.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};w.append(pb(t),i,k);c.append(w,m);A.append(c)})}
function ru(){A.append(h("p","mu","Translate into English aloud or in writing, then check. Model answers are suggestions."));R.forEach(([r,e])=>{const c=h("div","card"),a=h("div","ans"),b=h("button","chk","Show answer");b.onclick=()=>{a.append(h("span","",e),pb(e));b.remove()};c.append(h("div","",r),b,a);A.append(c)})}
function quiz(){let sc=0,dn=0;const S=h("div","sc","Score: 0 / "+Q.length);A.append(S);Q.forEach(([q,o,k])=>{const c=h("div","card");let d=false;c.append(h("b","",q));o.forEach((x,j)=>{const b=h("button","opt",x);b.onclick=()=>{if(d)return;d=true;dn++;if(j===k){sc++;b.classList.add("ok")}else{b.classList.add("no");c.children[k+1].classList.add("ok")}S.textContent="Score: "+sc+" / "+Q.length+(dn===Q.length?" · finished":"")};c.append(b)});A.append(c)})}
function view(){A.textContent="";[cards,listen,ru,quiz][tab]()}
T.forEach((n,i)=>{const b=h("button",i?"":"on",n);b.onclick=()=>{tab=i;[...document.getElementById("nav").children].forEach((x,j)=>x.className=j===i?"on":"");view()};document.getElementById("nav").append(b)});
if(syn)syn.getVoices();view();
</script></body></html>
