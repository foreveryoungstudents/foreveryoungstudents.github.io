<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Map — Moscow · Forever Young Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #d8cdb5; --surface: #f4efe3; --surface2: #ead9bd;
  --border: #cab181; --border2: #b89c68;
  --text: #2a2320; --text2: #46585a; --text3: #556462;
  --title: #14284b; --subtitle: #556853;
  --btn-bg: #14284b; --btn-text: #f1ead8; --btn-border: #14284b;
  --stripe: #a14534;
  --green: #3f5a3e; --green-bg: #dfe5d3; --green-bd: #7d8b7c;
  --red: #7c3a0c;   --red-bg: #f6dcbf;   --red-bd: #c2661c;
  --blue: #14284b;  --blue-bg: #cfd9d9;  --blue-bd: #77898b;
  --amber: #6b4a1c; --amber-bg: #ecdcb8; --amber-bd: #c85f31;
  --lvl-2: #cab181;
  --font-read: 'Literata', Georgia, 'Times New Roman', serif;
  --radius: 12px; --radius-lg: 14px;
  --shadow: 0 7px 24px rgba(84, 60, 40, .12);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117; --surface: #151b23; --surface2: #212830;
  --border: #2d343e; --border2: #3d444d;
  --text: #f1ead8; --text2: #bcc8c2; --text3: #93a39d;
  --title: #f1ead8; --subtitle: #a9bba8;
  --btn-bg: #212830; --btn-text: #e9e1cf; --btn-border: #3d444d;
  --stripe: #7e4733;
  --green: #b9cdb0; --green-bg: #1a261d; --green-bd: #7d8b7c;
  --red: #f2bb86; --red-bg: #2e1c0d; --red-bd: #c2661c;
  --blue: #c9d3dc; --blue-bg: #1c2430; --blue-bd: #6f7f8a;
  --amber: #e3cd9c; --amber-bg: #2a2314; --amber-bd: #cab181;
  --shadow: 0 7px 24px rgba(0, 0, 0, .35);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; display: block; height: 6px; background: var(--stripe); }
button { font-family: inherit; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

/* Header */
header { padding: 2rem 1.5rem 1.25rem; }
.h-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.h-title { display: flex; flex-direction: column; gap: 4px; }
.h-title h1 { font-size: clamp(24px, 5vw, 30px); font-weight: 800; letter-spacing: -.035em; line-height: 1.2; color: var(--title); }
.h-title span { font-size: 14px; font-weight: 700; color: var(--subtitle); }
.h-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.h-back, .theme-btn { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 12px 18px; font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; white-space: nowrap; text-decoration: none; transition: color .15s; }
.h-back:hover, .theme-btn:hover { color: var(--text); }

/* Toolbar */
.toolbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; position: sticky; top: 0; z-index: 40; }
.tb1 { max-width: 1100px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tb2 { max-width: 1100px; margin: .6rem auto 0; display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
input[type=text] { flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; font-family: inherit; font-size: 15px; color: var(--text); outline: none; transition: border-color .15s; }
input[type=text]::placeholder { color: var(--text3); }
input[type=text]:focus { border-color: var(--text3); }
.pill { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; transition: color .15s; white-space: nowrap; }
.pill:hover { color: var(--text); }
.pill.on, .pill.on:hover { background: var(--btn-bg); border-color: var(--btn-border); color: var(--btn-text); }
.tb-ct { font-size: 13px; font-weight: 500; color: var(--text3); margin-left: auto; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text3); }
input[type=range] { width: 110px; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border2); border-radius: 2px; cursor: pointer; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text2); border: 2px solid var(--surface); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text2); border: 2px solid var(--surface); cursor: pointer; }
.rv { color: var(--text); font-weight: 700; min-width: 30px; font-size: 13px; }
select { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text2); font-family: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; max-width: 200px; }

/* Панель проверки произношения — в шапке, на месте поиска */
.tb-slot { flex: 1; min-width: 180px; display: flex; }
.toolbar.sp-on #search { display: none; }
.toolbar.sp-on { position: sticky; top: 0; }
.sp-box { display: none; flex: 1; position: relative; min-height: 92px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--green-bd); border-radius: var(--radius); padding: 10px 44px 10px 16px; }
.sp-box.open { display: block; }
.sp-box[data-s="good"] { border-left-color: var(--green-bd); }
.sp-box[data-s="mid"] { border-left-color: var(--amber-bd); }
.sp-box[data-s="bad"] { border-left-color: var(--red-bd); }
.sp-lbl { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text2); margin-bottom: 4px; }
.sp-heard { font-size: 15px; line-height: 1.35; min-height: 2.7em; max-height: 2.7em; overflow-y: auto; margin-bottom: 4px; color: var(--text); }
.sp-heard b { color: var(--green); }
.sp-heard s { color: var(--red); text-decoration-color: var(--red-bd); }
.sp-verdict { font-size: 14px; font-weight: 500; min-height: 1.3em; }
.sp-verdict.good { color: var(--green); }
.sp-verdict.bad { color: var(--red); }
.sp-verdict.mid { color: var(--amber); }
.sp-x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 1px solid var(--border2); border-radius: 8px; background: var(--surface); color: var(--text2); font-size: 18px; line-height: 1; cursor: pointer; }
.sp-x:hover { color: var(--text); }

/* Table */
.wrap { max-width: 1100px; margin: 1.25rem auto 1.5rem; padding: 0 1.5rem; }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
th { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text2); padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; background: var(--surface2); }
td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.cw { width: 23%; } .ci { width: 16%; } .cr { width: 14%; } .ce { width: 39%; } .cs { width: 8%; text-align: center; }
.wn { font-size: 16px; font-weight: 700; color: var(--title); margin-bottom: 6px; line-height: 1.3; letter-spacing: -.01em; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1px solid; display: inline-block; }
.bv { color: var(--green); border-color: var(--green-bd); background: var(--green-bg); }
.bc { color: var(--amber); border-color: var(--amber-bd); background: var(--amber-bg); }
.bp { color: var(--blue); border-color: var(--blue-bd); background: var(--blue-bg); }
.ipa { font-family: 'Literata', 'Noto Sans', 'DejaVu Sans', Georgia, serif; font-size: 14px; color: var(--text2); line-height: 1.5; }
.ru { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; }
.ee { font-family: var(--font-read); font-size: 15px; color: var(--text); line-height: 1.55; margin-bottom: 4px; }
.er { font-size: 13px; font-weight: 500; color: var(--text3); line-height: 1.5; }
.btn-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.sb { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; width: 34px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--text2); transition: color .15s; padding: 0; }
.sb:hover { color: var(--text); }
.sb.playing { border-color: var(--amber-bd); color: var(--amber); background: var(--amber-bg); }
.sb.listening { border-color: var(--red-bd); color: var(--red); background: var(--red-bg); animation: pulse .7s infinite; }
.slb { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; }
.no-r { text-align: center; padding: 2.5rem; color: var(--text3); font-weight: 500; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }

/* Feedback */
.fb-wrap { max-width: 1100px; margin: 0 auto 3rem; padding: 0 1.5rem; }
.fb-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; box-shadow: var(--shadow); }
.fb-h { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text2); margin-bottom: .8rem; }
.stars { display: flex; gap: 4px; margin-bottom: .9rem; }
.star { font-size: 26px; cursor: pointer; color: var(--lvl-2); opacity: .45; transition: opacity .15s, transform .15s; user-select: none; }
.star:hover, .star.on { opacity: 1; color: var(--amber-bd); }
.star:hover { transform: scale(1.15); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: .9rem; }
.chip { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 500; color: var(--text2); cursor: pointer; transition: color .15s; }
.chip:hover { color: var(--text); }
.chip.on, .chip.on:hover { background: var(--btn-bg); border-color: var(--btn-border); color: var(--btn-text); }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; font-family: inherit; font-size: 15px; color: var(--text); resize: vertical; min-height: 80px; outline: none; transition: border-color .15s; margin-bottom: .9rem; display: block; }
textarea::placeholder { color: var(--text3); }
textarea:focus { border-color: var(--text3); }
.fb-row { display: flex; align-items: center; gap: 1rem; }
.fb-btn { background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 10px; padding: 10px 24px; font-size: 15px; font-weight: 500; cursor: pointer; transition: color .15s; }
.fb-btn:hover { color: #fff; }
.fb-ok { font-size: 15px; color: var(--green); font-weight: 700; display: none; }
.fb-err { font-size: 14px; color: var(--red); font-weight: 500; display: none; }
.fb-btn:disabled { opacity: .6; cursor: default; }

/* Телефон: строки таблицы становятся карточками */
@media (max-width: 760px) {
  header { padding: 1.25rem 1rem .75rem; }
  .toolbar { padding: .6rem 1rem; position: static; }
  .toolbar.sp-on { position: sticky; top: 0; }
  .wrap, .fb-wrap { padding: 0 1rem; }
  .tb-slot { flex: 1 1 100%; min-width: 0; }
  input[type=text] { flex: 1 1 100%; min-width: 0; }
  .pill { padding: 8px 12px; font-size: 13px; }
  .tb2 { gap: .5rem 1rem; }
  select { max-width: 150px; }
  .h-back, .theme-btn { padding: 10px 14px; }
  table, tbody { display: block; background: none; border: none; box-shadow: none; border-radius: 0; overflow: visible; }
  thead { display: none; }
  tr { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; }
  td { display: block; padding: 3px 0; border: none; width: auto !important; text-align: left !important; }
  .cw { padding-bottom: 6px; } .ci { padding-bottom: 2px; }
  .ce { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .cs { margin-top: 10px; }
  .btn-col { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
  .sb { width: 40px; height: 38px; font-size: 16px; }
  .slb { margin-right: 8px; }
  .fb-box { padding: 1rem; }
  .chips .chip { padding: 8px 12px; }
}
</style>
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>

<header>
  <div class="h-inner">
    <div class="h-title">
      <h1>Vocabulary Map — Moscow</h1>
      <span>35 терминов · Прогулки по Москве</span>
    </div>
    <div class="h-actions">
      <a class="h-back" href="https://foreveryoungstudents.github.io/">← На главную</a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Тема">Авто</button>
    </div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="tb1">
    <div class="tb-slot">
      <input type="text" id="search" placeholder="Слово, перевод или пример…" oninput="render()">
      <div class="sp-box" id="spBox">
        <button class="sp-x" type="button" onclick="closePanel()" aria-label="Закрыть">×</button>
        <div class="sp-lbl">Проверка произношения</div>
        <div class="sp-heard" id="spH">Слушаю…</div>
        <div class="sp-verdict" id="spV"></div>
      </div>
    </div>
    <button class="pill on" onclick="setF('all',this)">Все</button>
    <button class="pill" onclick="setF('vocab',this)">Лексика</button>
    <button class="pill" onclick="setF('cliche',this)">Клише</button>
    <button class="pill" onclick="setF('phrase',this)">Фразы</button>
    <span class="tb-ct" id="ct"></span>
  </div>
  <div class="tb2">
    <div class="ctl"><label>Скорость</label>
      <input type="range" id="rs" min="0.5" max="1.5" step="0.1" value="0.85"
        oninput="document.getElementById('rv').textContent=parseFloat(this.value).toFixed(1)+'×'">
      <span class="rv" id="rv">0.9×</span>
    </div>
    <div class="ctl"><label>Голос</label><select id="vs"></select></div>
  </div>
</div>

<div class="wrap">
  <table>
    <thead><tr>
      <th class="cw">Слово / фраза</th>
      <th class="ci">IPA</th>
      <th class="cr">Перевод</th>
      <th class="ce">Пример</th>
      <th class="cs">Слушать · Сказать</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="no-r" id="nr" style="display:none">Ничего не найдено.</div>
</div>

<div class="fb-wrap"><div class="fb-box">
  <div class="fb-h">Была ли карта полезной?</div>
  <div class="stars" id="stars">
    <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
    <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
    <span class="star" data-v="5">★</span>
  </div>
  <div class="chips" id="chips">
    <button class="chip" onclick="this.classList.toggle('on')">Удобно читать</button>
    <button class="chip" onclick="this.classList.toggle('on')">Помогло аудио</button>
    <button class="chip" onclick="this.classList.toggle('on')">Хорошие примеры</button>
    <button class="chip" onclick="this.classList.toggle('on')">Слишком много слов</button>
    <button class="chip" onclick="this.classList.toggle('on')">Нужно больше контекста</button>
    <button class="chip" onclick="this.classList.toggle('on')">Хочу больше клише</button>
  </div>
  <textarea id="fbTxt" placeholder="Комментарий для преподавателя (необязательно)…"></textarea>
  <div class="fb-row">
    <button class="fb-btn" onclick="submitFb()">Отправить</button>
    <span class="fb-ok" id="fbOk">✓ Спасибо!</span>
    <span class="fb-err" id="fbErr"></span>
  </div>
</div></div>

<script>
const D=[
  {t:'vocab',w:'inseparable from',i:'/ɪnˈsɛp.ər.ə.bəl frəm/',r:'неотделим от',e:'The history of Moscow is inseparable from the history of the country.',r2:'История Москвы неотделима от истории страны.'},
  {t:'vocab',w:'prosperous',i:'/ˈprɒs.pər.əs/',r:'процветающий',e:'It developed into a prosperous city over the centuries.',r2:'Он превратился в процветающий город за столетия.'},
  {t:'vocab',w:'architectural ensemble',i:'/ˌɑːk.ɪˈtek.tʃər.əl ɒnˈsɒm.bəl/',r:'архитектурный ансамбль',e:'It is a unique architectural ensemble, famous all over the world.',r2:'Это уникальный архитектурный ансамбль, известный всему миру.'},
  {t:'vocab',w:'chimes',i:'/tʃaɪmz/',r:'куранты',e:'The most famous tower is the Spasskaya Tower with its chimes.',r2:'Самая знаменитая — Спасская башня с курантами.'},
  {t:'vocab',w:'outlooks onto',i:'/ˈaʊt.lʊks ˈɒn.tuː/',r:'выходит на',e:'The Spasskaya Tower outlooks Red Square and the Pokrovsky Cathedral.',r2:'Спасская башня выходит на Красную площадь и собор.'},
  {t:'vocab',w:'exotic beauty',i:'/ɪɡˈzɒt.ɪk ˈbjuːti/',r:'экзотическая красота',e:'The cathedral is famous for its exotic beauty.',r2:'Собор известен своей экзотической красотой.'},
  {t:'vocab',w:'ceremonial dresses',i:'/ˌser.ɪˈməʊ.ni.əl ˈdres.ɪz/',r:'парадные одеяния',e:'The museum displays crowns, coaches and ceremonial dresses.',r2:'В музее выставлены короны, кареты и парадные облачения.'},
  {t:'vocab',w:'the seat of the government',i:'/ðə siːt əv ðə ˈɡʌv.ən.mənt/',r:'резиденция правительства',e:'Moscow is the seat of the government of the Russian Federation.',r2:'Москва — резиденция правительства РФ.'},
  {t:'vocab',w:'boundary',i:'/ˈbaʊnd.ri/',r:'граница; рубеж',e:'At first it was a little town on the boundary of the Kiev Russia.',r2:'Сначала это был маленький город на рубеже Киевской Руси.'},
  {t:'vocab',w:'come across',i:'/kʌm əˈkrɒs/',r:'наткнуться; встретить',e:'One can come across the sights on every step in Moscow.',r2:'В Москве достопримечательности встречаются на каждом шагу.'},
  {t:'vocab',w:'traffic jams',i:'/ˈtræf.ɪk dʒæmz/',r:'пробки',e:'Like any metropolis, Moscow has lines of cars and traffic jams.',r2:'Как любой мегаполис, Москва страдает от пробок.'},
  {t:'vocab',w:'capturing',i:'/ˈkæp.tʃər.ɪŋ/',r:'захватывающий',e:'Its appearance is not always attractive, but fascinating and capturing.',r2:'Облик не всегда привлекателен, но захватывающий.'},
  {t:'vocab',w:'beyond any doubt',i:'/bɪˈjɒnd ˈen.i daʊt/',r:'вне всяких сомнений',e:'Moscow is beyond any doubt one of the greatest cities in the world.',r2:'Москва вне всяких сомнений — один из величайших городов.'},
  {t:'vocab',w:'strolling by',i:'/ˈstrəʊ.lɪŋ baɪ/',r:'прогуливающиеся мимо',e:'One can enjoy watching the crowds of people strolling by on Arbat.',r2:'На Арбате приятно наблюдать за прогуливающимися людьми.'},
  {t:'vocab',w:'metropolis',i:'/məˈtrɒp.ə.lɪs/',r:'мегаполис',e:'Moscow is like any other metropolis — full of energy and contradictions.',r2:'Москва как любой мегаполис — полна энергии и противоречий.'},
  {t:'vocab',w:'treasures of the tsars',i:'/ˈtreʒ.əz əv ðə zɑːz/',r:'сокровища царей',e:'The Armoury is an exhibition of the treasures of the Russian tsars.',r2:'Оружейная палата — выставка сокровищ русских царей.'},

let filter='all',voices=[],curBtn=null,curMic=null,recog=null,fbRating=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* TTS */
function loadVoices(){
  if(!window.speechSynthesis)return;
  const s=document.getElementById('vs');
  const prev=voices[+s.value];
  const L=v=>v.lang.replace('_','-');
  const isG=v=>/google/i.test(v.name);
  const rank=v=>(isG(v)?0:10)+(L(v)==='en-GB'?0:L(v)==='en-US'?1:2);
  voices=speechSynthesis.getVoices().filter(v=>L(v).toLowerCase().startsWith('en')).sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
  s.innerHTML='';
  if(!voices.length){s.innerHTML='<option>Нет английских голосов</option>';return;}
  const gG=document.createElement('optgroup');gG.label='Google';
  const gO=document.createElement('optgroup');gO.label='Другие голоса';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+(v.default?' ★':'');(isG(v)?gG:gO).appendChild(o);});
  if(gG.children.length)s.appendChild(gG);
  if(gO.children.length)s.appendChild(gO);
  let p=prev?voices.findIndex(v=>v.name===prev.name):-1;
  if(p<0)p=0;
  s.value=p;
}
function tts(text,btn){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  if(curBtn){curBtn.classList.remove('playing');curBtn.textContent=curBtn.dataset.orig||'🔊';}
  if(curBtn===btn){curBtn=null;return;}
  const u=new SpeechSynthesisUtterance(text);
  const s=document.getElementById('vs');
  u.rate=parseFloat(document.getElementById('rs').value);
  if(voices.length&&s.value!=='')u.voice=voices[+s.value];
  btn.dataset.orig=btn.textContent;
  u.onstart=()=>{btn.classList.add('playing');btn.textContent='⏸';curBtn=btn;};
  u.onend=u.onerror=()=>{btn.classList.remove('playing');btn.textContent=btn.dataset.orig||'🔊';if(curBtn===btn)curBtn=null;};
  speechSynthesis.speak(u);
}

/* STT */
const inApp=/(telegram|instagram|fbav|fban|vkclient|vkontakte|; wv\)|miuibrowser)/i.test(navigator.userAgent);
function norm(t){return t.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);}
function scoreOf(target,heard){const t=norm(target),h=new Set(norm(heard));return t.filter(w=>h.has(w)).length/Math.max(t.length,1);}
function bestAlt(target,alts){return alts.slice().sort((x,y)=>scoreOf(target,y)-scoreOf(target,x))[0]||'';}
function resetMic(){if(curMic){curMic.classList.remove('listening');curMic.textContent='🎤';curMic=null;}}
function micErr(code){
  return ({
    'not-allowed':'Микрофон заблокирован. Разрешите доступ к микрофону для этого сайта в настройках браузера и попробуйте снова.',
    'service-not-allowed':'Распознавание речи отключено на устройстве. На iPhone: Настройки → Основные → Клавиатура → Включить диктовку, и разрешите «Siri и диктовку» для браузера.',
    'no-speech':'Ничего не слышно. Нажмите 🎤 и начинайте говорить сразу.',
    'audio-capture':'Микрофон не найден. Проверьте подключение и что его не занимает другое приложение.',
    'network':'Для распознавания речи нужен интернет. Проверьте соединение и попробуйте снова.',
    'language-not-supported':'Распознавание английской речи недоступно на этом устройстве.'
  })[code]||('Ошибка распознавания ('+code+'). Попробуйте ещё раз.');
}
function mic(target,btn){
  if(!SR){
    openPanel(inApp?'Этот встроенный браузер не умеет записывать речь. Откройте страницу в Chrome или Safari.'
      :(location.protocol==='file:'?'Распознавание речи не работает из локального файла. Откройте страницу по https-адресу.'
      :'Распознавание речи не поддерживается в этом браузере. Используйте Chrome или Edge (компьютер, Android) или Safari (iPhone).'),'bad');
    return;
  }
  if(curMic===btn){if(recog){try{recog.abort();}catch(e){}recog=null;}resetMic();closePanel();return;}
  if(recog){try{recog.abort();}catch(e){}recog=null;}
  resetMic();
  if(window.speechSynthesis){speechSynthesis.cancel();if(curBtn){curBtn.classList.remove('playing');curBtn.textContent=curBtn.dataset.orig||'🔊';curBtn=null;}}
  const r=new SR();recog=r;r.lang='en-US';r.interimResults=false;r.continuous=false;r.maxAlternatives=3;
  let got=false,done=false,timer=null;
  const finish=()=>{if(done)return;done=true;clearTimeout(timer);if(recog===r)recog=null;if(curMic===btn)resetMic();};
  btn.classList.add('listening');btn.textContent='⏹';curMic=btn;
  openPanel('Произнесите: <i>'+target+'</i>','');
  r.onresult=e=>{got=true;const alts=Array.from(e.results[0]).map(x=>x.transcript.trim().toLowerCase());showResult(target,bestAlt(target,alts));finish();};
  r.onerror=e=>{if(e.error==='aborted'){finish();return;}got=true;openPanel(micErr(e.error),'bad');finish();};
  r.onend=()=>{if(!got&&!done)openPanel(micErr('no-speech'),'mid');finish();};
  timer=setTimeout(()=>{if(!done){try{r.abort();}catch(e){}if(!got)openPanel(micErr('no-speech'),'mid');finish();}},12000);
  try{r.start();}catch(e){openPanel('Не удалось включить микрофон. Попробуйте ещё раз.','bad');finish();}
}
function openPanel(msg,cls){
  const b=document.getElementById('spBox');b.classList.add('open');b.dataset.s=cls||'';
  document.getElementById('toolbar').classList.add('sp-on');
  document.getElementById('spH').innerHTML=msg;
  const v=document.getElementById('spV');v.textContent='';v.className='sp-verdict'+(cls?' '+cls:'');
}
function closePanel(){
  document.getElementById('spBox').classList.remove('open');
  document.getElementById('toolbar').classList.remove('sp-on');
  if(recog){try{recog.abort();}catch(e){}recog=null;}
  resetMic();
}
function showResult(target,heard){
  const tWords=norm(target),hWords=heard.split(/\s+/).filter(Boolean);
  const tSet=new Set(tWords);
  const hl=hWords.map(w=>{const c=norm(w)[0]||'';return tSet.has(c)?`<b>${w}</b>`:`<s>${w}</s>`;}).join(' ');
  document.getElementById('spH').innerHTML=`Вы сказали: «${hl}»`;
  const score=scoreOf(target,heard);
  const v=document.getElementById('spV'),bx=document.getElementById('spBox');
  if(score>=0.8){v.textContent='✓ Отличное произношение!';v.className='sp-verdict good';bx.dataset.s='good';}
  else if(score>=0.5){v.textContent='Почти — попробуйте ещё раз.';v.className='sp-verdict mid';bx.dataset.s='mid';}
  else{v.textContent='Сначала послушайте, потом говорите медленнее.';v.className='sp-verdict bad';bx.dataset.s='bad';}
  bx.classList.add('open');
  document.getElementById('toolbar').classList.add('sp-on');
}

/* TABLE */
function setF(f,btn){filter=f;document.querySelectorAll('.pill').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const rows=D.filter(d=>{
    const mf=filter==='all'||d.t===filter;
    const mq=!q||[d.w,d.r,d.e,d.r2].some(s=>s.toLowerCase().includes(q));
    return mf&&mq;
  });
  document.getElementById('ct').textContent=`${rows.length} / ${D.length}`;
  document.getElementById('nr').style.display=rows.length?'none':'block';
  const bc=t=>t==='vocab'?'bv':t==='cliche'?'bc':'bp';
  const bl=t=>t==='vocab'?'Лексика':t==='cliche'?'Клише':'Фраза';
  document.getElementById('tb').innerHTML=rows.map((d,i)=>{
    const ws=d.w.replace(/'/g,"\\'").replace(/[…]/g,'');
    const es=d.e.replace(/'/g,"\\'");
    return`<tr style="animation:fadeUp .22s ${i*.025}s both">
      <td class="cw"><div class="wn">${d.w}</div><span class="badge ${bc(d.t)}">${bl(d.t)}</span></td>
      <td class="ci ipa">${d.i}</td>
      <td class="cr ru">${d.r}</td>
      <td class="ce"><div class="ee">${d.e}</div><div class="er">${d.r2}</div></td>
      <td class="cs"><div class="btn-col">
        <button class="sb" title="Послушать слово" onclick="tts('${ws}',this)">🔊</button>
        <span class="slb">слово</span>
        <button class="sb" title="Послушать пример" onclick="tts('${es}',this)">▶</button>
        <span class="slb">пример</span>
        <button class="sb" title="Произнести пример" onclick="mic('${es}',this)">🎤</button>
        <span class="slb">сказать</span>
      </div></td>
    </tr>`;
  }).join('');
}

/* FEEDBACK */
document.getElementById('stars').addEventListener('click',e=>{
  if(!e.target.classList.contains('star'))return;
  fbRating=+e.target.dataset.v;
  document.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',+s.dataset.v<=fbRating));
});
/* Адрес веб-приложения Google Apps Script вида https://script.google.com/macros/s/.../exec — вставьте свой между кавычками */
const SHEET_URL='https://script.google.com/macros/s/AKfycbwv2yx_w5ga6TQtOAExy-KU_bU0JY-DMgdp110SOhEBs0N41hry0Z77FH2tbpWP4YA/exec';
async function submitFb(){
  const btn=document.querySelector('.fb-btn'),ok=document.getElementById('fbOk'),err=document.getElementById('fbErr');
  const chips=[...document.querySelectorAll('.chip.on')].map(c=>c.textContent);
  const text=document.getElementById('fbTxt').value.trim();
  if(!fbRating&&!chips.length&&!text){err.textContent='Поставьте оценку или напишите комментарий.';err.style.display='inline';return;}
  err.style.display='none';
  const data={page:'Moscow',rating:fbRating||'',chips:chips.join(', '),text};
  btn.disabled=true;btn.textContent='Отправляю…';
  try{
    if(SHEET_URL){
      /* Apps Script не отдаёт CORS-заголовки, поэтому no-cors: ответ не читается, об ошибке сети узнаём по исключению */
      await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams(data)});
    }else{console.log('Feedback (SHEET_URL не задан):',data);}
    ok.style.display='inline';btn.style.display='none';
  }catch(e){
    err.textContent='Не удалось отправить. Проверьте интернет и попробуйте ещё раз.';err.style.display='inline';
    btn.disabled=false;btn.textContent='Отправить';
  }
}

/* INIT */
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,500);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&recog)recog.abort();});
render();
</script>
<script>
/* Тема: Авто → Светлая → Тёмная (по кругу), как на главной */
(function(){
  var root=document.documentElement,btn=document.getElementById('themeBtn');
  var L={auto:'Авто',light:'Светлая',dark:'Тёмная'},order=['auto','light','dark'];
  var mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  function saved(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}return t==='dark'||t==='light'?t:'auto'}
  function apply(m){
    root.setAttribute('data-theme',m==='auto'?(mq&&mq.matches?'dark':'light'):m);
    btn.textContent=L[m];btn.setAttribute('aria-label','Тема: '+L[m]);
  }
  btn.addEventListener('click',function(){
    var m=order[(order.indexOf(saved())+1)%3];
    try{if(m==='auto')localStorage.removeItem('theme');else localStorage.setItem('theme',m)}catch(e){}
    apply(m);
  });
  if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(saved()==='auto')apply('auto')});
  apply(saved());
})();
</script>
